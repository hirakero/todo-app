name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json どおりに厳密にインストールする（npm install より再現性が高い）
      - name: Install dependencies
        run: npm ci

      # LayoutProps などの型は .next/types に自動生成される（gitignore対象）。
      # CI では存在しないため、型チェックの前に生成しておく必要がある。
      - name: Generate route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build
